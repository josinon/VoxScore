apiVersion: v1
kind: ConfigMap
metadata:
  name: voxscore-api-config
data:
  TYPEORM_MIGRATIONS_RUN: 'false'
  AUTH_GOOGLE_MOCK_ENABLED: 'true'
  AUTH_DEV_TOKEN_ENABLED: 'false'
  SWAGGER_ENABLED: 'true'
  BOOTSTRAP_ADMIN_EMAIL: admin@voxscore.test
  BOOTSTRAP_ADMIN_DISPLAY_NAME: Administrator
  CORS_ORIGINS: https://staging-megavoz.lab6.cloud
  REDIS_URL: redis://redis:6379
  REDIS_REQUIRED: 'true'
  THROTTLE_VOTES_LIMIT: '10000'
  THROTTLE_VOTES_TTL_MS: '60000'
  DATABASE_POOL_MAX: '5'
  DATABASE_POOL_MIN: '1'
  RANKING_CACHE_ENABLED: 'true'
  RANKING_CACHE_TTL_MS: '3000'
