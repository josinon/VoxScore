# PostgreSQL dentro do cluster (StatefulSet + PVC) + stack base (API, frontend, Ingress).
#
# TLS: o overlay aplica patch no Ingress para cert-manager. O ClusterIssuer é cluster-scoped;
# aplique-o à parte (não entra no kustomize) para evitar namespace inválido no recurso.
#
# Segredos: copie secrets.env.example → secrets.env e preencha valores reais.
# secrets.env está no .gitignore. Ambos os Secrets leem esse ficheiro (chaves
# não usadas por um Secret são ignoradas pelos pods).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voxscore

resources:
  - ../../base
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml

secretGenerator:
  - name: postgres-credentials
    options:
      disableNameSuffixHash: true
    envs:
      - secrets.env
  - name: voxscore-api
    options:
      disableNameSuffixHash: true
    envs:
      - secrets.env

patches:
  - path: patch-deployment-api.yaml
  - path: patch-configmap-redis.yaml
  - path: patch-ingress-cert-manager.yaml

images:
  - name: josinon/voxscore-api
    newName: josinon/voxscore-api
    newTag: "0.0.21"
  - name: josinon/voxscore-frontend
    newName: josinon/voxscore-frontend
    newTag: "0.0.21"
